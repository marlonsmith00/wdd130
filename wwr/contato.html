<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale Conosco - Rafting Aventura</title>
  <meta name="description" content="Entre em contato com a equipe do Rafting Aventura para dúvidas, reservas e sugestões. Estamos prontos para atender você.">
  <link rel="stylesheet" href="estilos/rafting.css">
</head>
<body>
  <header>
    <img src="imagens/logo.png" alt="Rafting Aventura Logo" class="logo">
    <nav>
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre Nós</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="contato-container">
    <h1>Fale Conosco</h1>

    <!-- SEÇÃO 1: Informações de Contato e Mapa -->
    <section class="info-contato">
      <div class="detalhes">
        <h2>Nossas Informações</h2>
        <p><strong>Endereço:</strong> Av. das Corredeiras, 1000 - Vale Radical</p>
        <p><strong>Telefone:</strong> (82) 99999-8888</p>
        <p><strong>E-mail:</strong> contato@raftingaventura.com</p>
      </div>

      <div class="mapa">
        <!-- Google Maps Iframe (Sem o style inline) -->
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d144.95373531531615!3d-37.81720997975171!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d4c2b349649%3A0xb6899234e561db11!2sEnvato!5e0!3m2!1sen!2sau!4v1614055230000!5m2!1sen!2sau" 
          width="100%" 
          height="250" 
          allowfullscreen="" 
          loading="lazy"
          title="Localização do Rafting Aventura">
        </iframe>
      </div>
    </section>

    <!-- SEÇÃO 2: Equipe da Empresa -->
    <section class="equipe">
      <h2>Nossa Equipe</h2>
      <div class="grid-equipe">
        <figure>
          <img src="imagens/aventura1.jpg" alt="Foto de Carlos Silva">
          <figcaption><strong>Carlos Silva</strong><br>Guia Principal</figcaption>
        </figure>
        <figure>
          <img src="imagens/aventura2.jpg" alt="Foto de Ana Souza">
          <figcaption><strong>Ana Souza</strong><br>Gerente de Operações</figcaption>
        </figure>
        <figure>
          <img src="imagens/aventura3.jpg" alt="Foto de Marcos Lima">
          <figcaption><strong>Marcos Lima</strong><br>Atendimento ao Cliente</figcaption>
        </figure>
      </div>
    </section>

    <!-- SEÇÃO 3: Formulário de Contato -->
    <section class="formulario-secao">
      <h2>Envie uma Mensagem</h2>
      <form action="#" method="post" class="form-contato">
        
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <fieldset>
          <legend>Finalidade da Mensagem:</legend>
          <label>
            <input type="radio" name="finalidade" value="geral" checked> Consulta Geral
          </label>
          <label>
            <input type="radio" name="finalidade" value="reserva"> Pergunta sobre Reserva
          </label>
          <label>
            <input type="radio" name="finalidade" value="sugestao"> Sugestão de Site
          </label>
        </fieldset>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

        <div class="checkbox-container">
          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">Quero receber a newsletter mensal</label>
        </div>

        <button type="submit" class="btn-enviar">Enviar Mensagem</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Rafting Aventura - Marlon Smith</p>
    <div class="socialmedia">
      <a href="https://facebook.com" target="_blank"><img src="imagens/facebook.png" alt="Facebook"></a>
      <a href="https://instagram.com" target="_blank"><img src="imagens/instagram.png" alt="Instagram"></a>
      <a href="https://youtube.com" target="_blank"><img src="imagens/youtube.png" alt="YouTube"></a>
    </div>
  </footer>
</body>
</html>
